[package]
name = "stand-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Двусторонняя синхронизация папки стенда с префиксом S3 Timeweb"
publish = false
license = "MIT"

[[bin]]
name = "sync"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
aws-sdk-s3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
walkdir = "2"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
keyring = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
